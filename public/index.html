<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#BlindDrams — Group Feed</title>
<!-- Emoji picker web component -->
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0e17;
    --surface: #111827;
    --surf2:   #1a2333;
    --border:  #1e2d3d;
    --accent:  #3b82f6;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --amber:   #f59e0b;
    --red:     #ef4444;
    --green:   #22c55e;
    --like:    #f43f5e;
    --gold:    #fbbf24;
    --sidebar: 340px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: rgba(10,14,23,.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 20;
  }
  #pulse {
    width:8px; height:8px; border-radius:50%;
    background:var(--amber);
    animation: pulse 2s ease-in-out infinite; flex-shrink:0;
  }
  @keyframes pulse {
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.4;transform:scale(.7);}
  }
  header h1 { font-size:1.1rem; font-weight:700; flex:1; }
  header h1 span { color:var(--accent); }
  #count-badge {
    background:var(--accent); color:#fff;
    font-size:.7rem; font-weight:700;
    padding:2px 8px; border-radius:999px;
  }
  #feed-status { font-size:.73rem; color:var(--muted); }

  /* ── Two-column layout ───────────────────────────── */
  .layout { display:flex; flex:1; overflow:hidden; }

  /* ── Left: fixed compose panel ──────────────────── */
  .compose-panel {
    width: var(--sidebar);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Right: scrollable feed ──────────────────────── */
  .feed-panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 40px;
  }

  /* ── Post cards ──────────────────────────────────── */
  #feed { display:flex; flex-direction:column; gap:9px; }

  .post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from{opacity:0;transform:translateY(-5px);}
    to{opacity:1;transform:translateY(0);}
  }

  .post-header { display:flex; align-items:center; gap:8px; margin-bottom:7px; }

  .avatar {
    width:34px; height:34px; border-radius:50%;
    object-fit:cover; background:var(--border); flex-shrink:0;
  }
  .avatar-ph {
    width:34px; height:34px; border-radius:50%;
    background:var(--border); display:flex;
    align-items:center; justify-content:center;
    font-size:.85rem; flex-shrink:0; color:var(--muted);
  }
  .author-info { flex:1; min-width:0; }
  .display-name {
    font-weight:600; font-size:.85rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .handle { font-size:.72rem; color:var(--muted); }
  .ts { font-size:.7rem; color:var(--muted); white-space:nowrap; flex-shrink:0; }

  .post-text {
    font-size:.88rem; line-height:1.55;
    white-space:pre-wrap; word-break:break-word;
  }
  .post-text .ht { color:var(--accent); font-weight:500; }

  .post-footer {
    display:flex; align-items:center; gap:2px;
    margin-top:9px;
  }

  .action-btn {
    display:flex; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer;
    color:var(--muted); font-size:.78rem;
    padding:4px 7px; border-radius:6px;
    transition:background .12s, color .12s;
  }
  .action-btn:hover { background:var(--surf2); }
  .action-btn svg { width:15px; height:15px; flex-shrink:0; }

  .action-btn.like:hover { color:var(--like); }
  .action-btn.like.liked { color:var(--like); }
  .action-btn.like.liked svg { fill:var(--like); }

  .open-btn {
    margin-left:auto; color:var(--accent);
    text-decoration:none; font-size:.72rem; padding:4px 7px;
    border-radius:6px;
  }
  .open-btn:hover { background:var(--surf2); }

  /* Post images / GIFs */
  .post-images {
    display: grid;
    gap: 4px;
    margin-top: 9px;
    border-radius: 8px;
    overflow: hidden;
  }
  .post-images.count-1 { grid-template-columns: 1fr; }
  .post-images.count-2 { grid-template-columns: 1fr 1fr; }
  .post-images.count-3 { grid-template-columns: 1fr 1fr; }
  .post-images.count-3 .post-img:first-child { grid-column: 1 / -1; }
  .post-images.count-4 { grid-template-columns: 1fr 1fr; }

  .post-img {
    display: block; width: 100%;
    aspect-ratio: 16/9; object-fit: cover;
    background: var(--border); cursor: pointer;
    transition: opacity .15s;
  }
  .post-img:hover { opacity: .88; }

  .post-gif-wrap {
    position: relative; width: 100%;
    padding-top: 75%; /* 4:3 default ratio */
    border-radius: 8px; overflow: hidden;
    margin-top: 9px; background: var(--border);
  }
  .post-gif-wrap iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* ── Compose panel ────────────────────────────────── */
  #user-strip {
    display:none; align-items:center; gap:8px;
    padding:12px 14px; border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #user-strip.on { display:flex; }
  #u-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; background:var(--border); }
  #u-name   { font-weight:600; font-size:.83rem; }
  #u-handle { font-size:.7rem; color:var(--muted); }
  #signout-btn {
    margin-left:auto; background:none; border:none;
    cursor:pointer; color:var(--muted); font-size:.72rem;
    padding:3px 8px; border-radius:5px;
  }
  #signout-btn:hover { color:var(--red); background:rgba(239,68,68,.1); }

  /* Login */
  #login-section { padding:16px; flex-shrink:0; }
  .pl { font-size:.65rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }

  .ff { display:flex; flex-direction:column; gap:4px; margin-bottom:9px; }
  .ff label { font-size:.75rem; color:var(--muted); }

  input[type=text], input[type=password] {
    background:var(--surf2); border:1px solid var(--border);
    border-radius:7px; color:var(--text); font-size:.85rem;
    padding:7px 10px; outline:none; width:100%;
    transition:border-color .15s;
  }
  input:focus { border-color:var(--accent); }

  .btn-login {
    width:100%; padding:8px; border:none; border-radius:7px;
    font-size:.85rem; font-weight:600; cursor:pointer;
    background:var(--accent); color:#fff;
    transition:opacity .15s;
  }
  .btn-login:disabled { opacity:.5; cursor:not-allowed; }
  .btn-login:hover:not(:disabled) { opacity:.85; }

  #login-err {
    display:none; font-size:.75rem; color:#fca5a5;
    background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25);
    border-radius:6px; padding:6px 9px; margin-top:7px;
  }

  /* Compose box */
  #compose-section { display:none; flex-direction:column; flex:1; overflow:hidden; }
  #compose-section.on { display:flex; }

  /* Image previews */
  #img-previews {
    display:none; flex-wrap:wrap; gap:6px;
    padding:10px 12px 0;
  }
  #img-previews.on { display:flex; }

  .img-thumb {
    position:relative; width:72px; height:72px; border-radius:6px;
    overflow:hidden; border:1px solid var(--border);
  }
  .img-thumb img { width:100%; height:100%; object-fit:cover; }
  .img-rm {
    position:absolute; top:2px; right:2px;
    width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,.7); border:none; cursor:pointer;
    color:#fff; font-size:10px; display:flex;
    align-items:center; justify-content:center; line-height:1;
  }

  /* The textarea */
  #compose-body { padding:10px 12px 0; flex:1; display:flex; flex-direction:column; }

  #compose-text {
    flex:1; min-height:80px; max-height:140px;
    resize:none;
    background:transparent; border:none;
    color:var(--text); font-size:.9rem;
    font-family:inherit; line-height:1.5;
    outline:none; width:100%;
  }
  #compose-text::placeholder { color:var(--muted); }

  /* Divider */
  .compose-divider { height:1px; background:var(--border); margin:8px 0 0; }

  /* Toolbar */
  #compose-toolbar {
    display:flex; align-items:center; gap:2px;
    padding:6px 8px;
    flex-shrink:0;
  }

  .tool-btn {
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; cursor:pointer;
    color:var(--accent); border-radius:6px;
    transition:background .12s;
  }
  .tool-btn:hover { background:rgba(59,130,246,.12); }
  .tool-btn svg { width:18px; height:18px; }
  .tool-btn:disabled { opacity:.35; cursor:not-allowed; }

  #char-ring {
    position:relative; width:24px; height:24px;
    flex-shrink:0; margin-left:auto;
  }
  #char-ring svg { width:24px; height:24px; transform:rotate(-90deg); }
  #char-ring .track { fill:none; stroke:var(--border); stroke-width:2.5; }
  #char-ring .fill  { fill:none; stroke:var(--accent); stroke-width:2.5;
                      stroke-linecap:round;
                      transition:stroke-dashoffset .15s, stroke .15s; }
  #char-num {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    font-size:.55rem; color:var(--muted);
  }

  #post-btn {
    margin-left:6px; padding:6px 14px;
    background:var(--accent); color:#fff;
    border:none; border-radius:999px;
    font-size:.83rem; font-weight:700;
    cursor:pointer; transition:opacity .15s;
  }
  #post-btn:disabled { opacity:.45; cursor:not-allowed; }
  #post-btn:hover:not(:disabled) { opacity:.85; }

  #post-feedback {
    display:none; font-size:.75rem;
    border-radius:6px; padding:6px 10px; margin:0 12px 8px;
  }
  #post-feedback.ok  { display:block; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); color:#86efac; }
  #post-feedback.err { display:block; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }

  /* Emoji picker popup */
  #emoji-popup {
    display:none; position:fixed; z-index:100;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.5));
  }
  #emoji-popup.on { display:block; }

  emoji-picker {
    --background: #1a2333;
    --border-color: #1e2d3d;
    --button-active-background: #243447;
    --button-hover-background: #1e2d3d;
    --category-emoji-size: 1.1rem;
    --emoji-size: 1.2rem;
    --indicator-color: #3b82f6;
    --input-border-color: #1e2d3d;
    --input-font-color: #e2e8f0;
    --input-placeholder-color: #64748b;
    --outline-color: #3b82f6;
    --text-color: #e2e8f0;
    height: 340px;
    width: 290px;
  }

  /* ── Mode tabs ──────────────────────────────────── */
  .mode-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
  .mode-tab { flex:1; padding:9px 4px; text-align:center; font-size:.78rem; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; }
  .mode-tab:hover { color:var(--text); }
  .mode-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* ── Tasting / free-post panels ─────────────────── */
  #tasting-panel    { display:flex; flex-direction:column; flex:1; overflow:hidden; }
  #free-post-panel  { display:none; flex-direction:column; flex:1; overflow:hidden; }
  #free-post-panel.on { display:flex; }

  /* Dram tabs */
  .dram-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
  .dram-tabs::-webkit-scrollbar { display:none; }
  .dram-tab { flex:1; padding:8px 2px; text-align:center; font-size:.72rem; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; white-space:nowrap; }
  .dram-tab:hover { color:var(--text); }
  .dram-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .dram-tab.done { color:var(--green); }
  .dram-tab.done.active { color:var(--accent); }

  /* Section blocks */
  .dram-content { flex:1; overflow-y:auto; padding:11px; display:flex; flex-direction:column; gap:8px; }
  .section-block { background:var(--surf2); border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-bottom:1px solid var(--border); }
  .section-label { font-size:.65rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .post-sec-btn { font-size:.68rem; font-weight:600; background:none; border:1px solid var(--border); color:var(--muted); border-radius:5px; padding:2px 7px; cursor:pointer; transition:all .12s; }
  .post-sec-btn:hover { border-color:var(--accent); color:var(--accent); }
  .post-sec-btn:disabled { opacity:.4; cursor:not-allowed; }
  .sec-textarea { width:100%; background:transparent; border:none; color:var(--text); font-size:.82rem; font-family:inherit; line-height:1.5; padding:8px 10px; outline:none; resize:none; min-height:56px; max-height:100px; }
  .sec-textarea::placeholder { color:var(--muted); }

  /* Score picker */
  .score-block { background:var(--surf2); border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .score-header { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-bottom:1px solid var(--border); }
  .stars-row { display:flex; justify-content:center; align-items:center; gap:5px; padding:9px 10px 4px; }
  .star-btn { background:none; border:none; cursor:pointer; font-size:1.4rem; line-height:1; padding:2px; transition:transform .12s; color:var(--border); }
  .star-btn:hover { transform:scale(1.2); }
  .star-btn.filled { color:var(--gold); }
  .star-btn.zero { font-size:1.1rem; color:var(--muted); }
  .star-btn.zero.selected { color:var(--red); }
  .t-score-desc { font-size:.7rem; color:var(--muted); font-style:italic; padding:0 10px 8px; line-height:1.4; min-height:32px; text-align:center; }

  /* Post-all */
  .post-all-wrap { padding:0 11px 11px; flex-shrink:0; }
  .post-all-btn { width:100%; padding:8px; background:var(--accent); color:#fff; border:none; border-radius:7px; font-size:.82rem; font-weight:700; cursor:pointer; transition:opacity .15s; }
  .post-all-btn:hover:not(:disabled) { opacity:.85; }
  .post-all-btn:disabled { opacity:.45; cursor:not-allowed; }
  #tasting-feedback { display:none; font-size:.72rem; border-radius:6px; padding:6px 10px; margin:0 11px 8px; }
  #tasting-feedback.ok  { display:block; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); color:#86efac; }
  #tasting-feedback.err { display:block; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }

  /* Feed empty / error */
  #empty { text-align:center; color:var(--muted); padding:60px 0; }
  #empty .big { font-size:2.5rem; margin-bottom:8px; }
  #feed-err {
    display:none;
    background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
    color:#fca5a5; border-radius:8px; padding:9px 13px; margin-bottom:10px; font-size:.82rem;
  }
</style>
</head>
<body>

<header>
  <div id="pulse"></div>
  <h1><span>#BlindDrams</span> Live Feed</h1>
  <span id="count-badge">0 posts</span>
  <span id="feed-status">connecting…</span>
</header>

<div class="layout">

  <!-- ── Left: fixed compose panel ── -->
  <div class="compose-panel">

    <!-- Logged-in user strip -->
    <div id="user-strip">
      <img id="u-avatar" src="" alt="">
      <div style="min-width:0">
        <div id="u-name"></div>
        <div id="u-handle"></div>
      </div>
      <button id="signout-btn">Sign out</button>
    </div>

    <!-- Login -->
    <div id="login-section">
      <div class="pl">Sign in to post &amp; like</div>
      <div class="ff">
        <label for="inp-handle">BlueSky handle or email</label>
        <input id="inp-handle" type="text" placeholder="you.bsky.social" autocomplete="username">
      </div>
      <div class="ff">
        <label for="inp-pw">App password</label>
        <input id="inp-pw" type="password" placeholder="xxxx-xxxx-xxxx-xxxx" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn-login">Sign in</button>
      <div id="login-err"></div>
    </div>

    <!-- Compose (visible after login) -->
    <div id="compose-section">

      <!-- Mode tabs -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-tasting">🥃 Tasting</button>
        <button class="mode-tab"        id="tab-post">✏️ Free Post</button>
      </div>

      <!-- ── Tasting panel ── -->
      <div id="tasting-panel">
        <div class="dram-tabs" id="dram-tabs">
          <button class="dram-tab active" data-dram="1">Dram 1</button>
          <button class="dram-tab"        data-dram="2">Dram 2</button>
          <button class="dram-tab"        data-dram="3">Dram 3</button>
          <button class="dram-tab"        data-dram="4">Dram 4</button>
          <button class="dram-tab"        data-dram="5">Dram 5</button>
        </div>
        <div class="dram-content">
          <div class="section-block">
            <div class="section-header"><span class="section-label">👃 Nose</span><button class="post-sec-btn" id="t-post-nose">Post</button></div>
            <textarea class="sec-textarea" id="t-nose" placeholder="What do you smell?" rows="3"></textarea>
          </div>
          <div class="section-block">
            <div class="section-header"><span class="section-label">👅 Palate</span><button class="post-sec-btn" id="t-post-palate">Post</button></div>
            <textarea class="sec-textarea" id="t-palate" placeholder="What do you taste?" rows="3"></textarea>
          </div>
          <div class="section-block">
            <div class="section-header"><span class="section-label">🔥 Finish</span><button class="post-sec-btn" id="t-post-finish">Post</button></div>
            <textarea class="sec-textarea" id="t-finish" placeholder="How does it end?" rows="3"></textarea>
          </div>
          <div class="score-block">
            <div class="score-header"><span class="section-label">🏅 Score</span><button class="post-sec-btn" id="t-post-score">Post</button></div>
            <div class="stars-row" id="t-stars">
              <button class="star-btn zero" data-score="0">🚫</button>
              <button class="star-btn" data-score="1">★</button>
              <button class="star-btn" data-score="2">★</button>
              <button class="star-btn" data-score="3">★</button>
              <button class="star-btn" data-score="4">★</button>
              <button class="star-btn" data-score="5">★</button>
            </div>
            <div class="t-score-desc" id="t-score-desc">Tap a star to score</div>
          </div>
        </div>
        <div id="tasting-feedback"></div>
        <div class="post-all-wrap">
          <button class="post-all-btn" id="t-post-all">Post Everything for Dram <span id="t-dram-num">1</span></button>
        </div>
      </div>

      <!-- ── Free post panel ── -->
      <div id="free-post-panel">
        <div id="img-previews"></div>
        <div id="compose-body">
          <textarea id="compose-text" placeholder="Your tasting notes…"></textarea>
        </div>
        <div class="compose-divider"></div>
        <div id="compose-toolbar">
          <input id="img-input" type="file" accept="image/*" multiple style="display:none">
          <button class="tool-btn" id="img-btn" title="Add image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <button class="tool-btn" id="emoji-btn" title="Add emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
          </button>
          <div id="char-ring">
            <svg viewBox="0 0 24 24">
              <circle class="track" cx="12" cy="12" r="9"/>
              <circle class="fill" cx="12" cy="12" r="9" id="ring-fill" stroke-dasharray="56.5" stroke-dashoffset="56.5"/>
            </svg>
            <div id="char-num"></div>
          </div>
          <button id="post-btn" disabled>Post</button>
        </div>
        <div id="post-feedback"></div>
      </div>

    </div>

  </div>

  <!-- ── Right: scrollable feed ── -->
  <div class="feed-panel">
    <div id="feed-err"></div>
    <div id="feed">
      <div id="empty">
        <div class="big">🥃</div>
        Waiting for <strong>#BlindDrams</strong> posts…
      </div>
    </div>
  </div>

</div>

<!-- Emoji picker popup (positioned by JS) -->
<div id="emoji-popup">
  <emoji-picker></emoji-picker>
</div>

<script>
// ── DOM refs ──────────────────────────────────────────────────────
const feedEl       = document.getElementById('feed');
const feedStatus   = document.getElementById('feed-status');
const badgeEl      = document.getElementById('count-badge');
const emptyEl      = document.getElementById('empty');
const feedErrEl    = document.getElementById('feed-err');

const loginSection = document.getElementById('login-section');
const userStrip    = document.getElementById('user-strip');
const composeSec   = document.getElementById('compose-section');

const inpHandle    = document.getElementById('inp-handle');
const inpPw        = document.getElementById('inp-pw');
const loginBtn     = document.getElementById('login-btn');
const loginErrEl   = document.getElementById('login-err');

const uAvatar      = document.getElementById('u-avatar');
const uName        = document.getElementById('u-name');
const uHandle      = document.getElementById('u-handle');
const signoutBtn   = document.getElementById('signout-btn');

const imgPreviews  = document.getElementById('img-previews');
const imgInput     = document.getElementById('img-input');
const imgBtn       = document.getElementById('img-btn');
const emojiBtn     = document.getElementById('emoji-btn');
const emojiPopup   = document.getElementById('emoji-popup');
const emojiPicker  = document.querySelector('emoji-picker');
const composeText  = document.getElementById('compose-text');
const ringFill     = document.getElementById('ring-fill');
const charNum      = document.getElementById('char-num');
const postBtn      = document.getElementById('post-btn');
const postFeedback = document.getElementById('post-feedback');

// ── State ─────────────────────────────────────────────────────────
let sessionId   = sessionStorage.getItem('bsk_sid') || null;
let userInfo    = JSON.parse(sessionStorage.getItem('bsk_user') || 'null');
let localLikes  = new Map();   // postUri → likeUri
let pendingBlobs = [];          // [{ blob, previewUrl, alt }]
let lastUpdated  = null;

// ── Helpers ───────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function relativeTime(iso) {
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 60)    return `${Math.floor(d)}s ago`;
  if (d < 3600)  return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}

function graphemeLen(s) {
  try { return [...new Intl.Segmenter().segment(s)].length; }
  catch { return s.length; }
}

// SVG hearts
const HEART_PATH = `M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z`;
const heartOutline = `<svg viewBox="0 0 24 24" fill="none"            stroke="currentColor"    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${HEART_PATH}"/></svg>`;
const heartFilled  = `<svg viewBox="0 0 24 24" fill="var(--like)"      stroke="var(--like)"     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${HEART_PATH}"/></svg>`;

// ── Character counter ─────────────────────────────────────────────
const MAX = 300;
const SUFFIX_LEN = 13; // ' #BlindDrams'
const CIRCUM = 56.5;

function updateCharCount() {
  const raw = composeText.value;
  const hasTag = /\#blinddrams\b/i.test(raw);
  const len = graphemeLen(raw) + (hasTag ? 0 : SUFFIX_LEN);
  const remaining = MAX - len;

  const fraction = Math.min(len / MAX, 1);
  ringFill.style.strokeDashoffset = CIRCUM - fraction * CIRCUM;
  ringFill.style.stroke = remaining < 0 ? 'var(--red)' : remaining < 30 ? 'var(--amber)' : 'var(--accent)';

  if (remaining <= 30) {
    charNum.textContent = remaining;
    charNum.style.color = remaining < 0 ? 'var(--red)' : 'var(--amber)';
  } else {
    charNum.textContent = '';
  }

  postBtn.disabled = remaining < 0 || len <= (hasTag ? 0 : SUFFIX_LEN);
}

composeText.addEventListener('input', updateCharCount);
updateCharCount();

// ── Emoji picker ──────────────────────────────────────────────────
function insertAtCursor(text) {
  const s = composeText.selectionStart, e = composeText.selectionEnd;
  composeText.value = composeText.value.slice(0,s) + text + composeText.value.slice(e);
  composeText.selectionStart = composeText.selectionEnd = s + text.length;
  composeText.dispatchEvent(new Event('input'));
  composeText.focus();
}

emojiBtn.addEventListener('click', e => {
  e.stopPropagation();
  const rect = emojiBtn.getBoundingClientRect();
  emojiPopup.style.top  = `${rect.bottom + 6}px`;
  emojiPopup.style.left = `${rect.left}px`;
  emojiPopup.classList.toggle('on');
});

emojiPicker.addEventListener('emoji-click', e => {
  insertAtCursor(e.detail.unicode);
  emojiPopup.classList.remove('on');
});

document.addEventListener('click', e => {
  if (!emojiPopup.contains(e.target) && e.target !== emojiBtn)
    emojiPopup.classList.remove('on');
});

// ── Image upload ──────────────────────────────────────────────────
imgBtn.addEventListener('click', () => imgInput.click());

imgInput.addEventListener('change', async () => {
  const files = [...imgInput.files].slice(0, 4 - pendingBlobs.length);
  imgInput.value = '';
  if (!files.length || !sessionId) return;

  imgBtn.disabled = true;

  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    const data = await new Promise(res => {
      reader.onload = e => res(e.target.result);
      reader.readAsDataURL(file);
    });
    const base64 = data.split(',')[1];
    const previewUrl = data;

    try {
      const r = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, imageData: base64, mimeType: file.type }),
      });
      const json = await r.json();
      if (!r.ok) throw new Error(json.error);
      pendingBlobs.push({ blob: json.blob, previewUrl, alt: '' });
      renderImgPreviews();
    } catch (err) {
      console.error('Upload error:', err.message);
    }
  }

  imgBtn.disabled = pendingBlobs.length >= 4;
});

function renderImgPreviews() {
  imgPreviews.innerHTML = '';
  if (!pendingBlobs.length) {
    imgPreviews.classList.remove('on');
    return;
  }
  imgPreviews.classList.add('on');
  pendingBlobs.forEach((item, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-thumb';
    wrap.innerHTML = `
      <img src="${item.previewUrl}" alt="">
      <button class="img-rm" title="Remove">✕</button>`;
    wrap.querySelector('.img-rm').onclick = () => {
      pendingBlobs.splice(idx, 1);
      imgBtn.disabled = false;
      renderImgPreviews();
    };
    imgPreviews.appendChild(wrap);
  });
}

// ── Post ──────────────────────────────────────────────────────────
postBtn.addEventListener('click', async () => {
  const text = composeText.value.trim();
  if (!text || !sessionId) return;

  postBtn.disabled = true;
  postBtn.textContent = 'Posting…';
  postFeedback.className = '';
  postFeedback.style.display = 'none';

  try {
    const r = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId, text,
        blobs: pendingBlobs.map(b => b.blob),
      }),
    });
    const data = await r.json();
    if (!r.ok) { if (r.status===401) { showLoggedOut(); return; } throw new Error(data.error||'Post failed'); }

    composeText.value = '';
    pendingBlobs = [];
    renderImgPreviews();
    updateCharCount();
    postFeedback.textContent = '✓ Posted!';
    postFeedback.className = 'ok';
    setTimeout(() => { postFeedback.className=''; postFeedback.style.display='none'; }, 3000);
    pollFeed();
  } catch (err) {
    postFeedback.textContent = err.message;
    postFeedback.className = 'err';
  } finally {
    postBtn.disabled = false;
    postBtn.textContent = 'Post';
  }
});

// ── Like / unlike ─────────────────────────────────────────────────
feedEl.addEventListener('click', async e => {
  const btn = e.target.closest('.like-btn');
  if (!btn || !sessionId) return;

  const uri     = btn.dataset.uri;
  const cid     = btn.dataset.cid;
  const likeUri = localLikes.get(uri);

  // Capture count BEFORE any DOM changes
  const currentCount = parseInt(btn.querySelector('.lc')?.textContent || '0', 10);

  btn.disabled = true;

  if (likeUri) {
    // Unlike — optimistic UI update first
    localLikes.delete(uri);
    btn.classList.remove('liked');
    btn.innerHTML = `${heartOutline}<span class="lc">${Math.max(0, currentCount - 1)}</span>`;

    const r = await fetch('/api/unlike', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, likeUri }),
    });
    if (!r.ok) {
      // Revert on failure
      localLikes.set(uri, likeUri);
      btn.classList.add('liked');
      btn.innerHTML = `${heartFilled}<span class="lc">${currentCount}</span>`;
    }
  } else {
    // Like — optimistic UI update first
    btn.classList.add('liked');
    btn.innerHTML = `${heartFilled}<span class="lc">${currentCount + 1}</span>`;

    const r = await fetch('/api/like', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, uri, cid }),
    });
    if (r.ok) {
      const data = await r.json();
      localLikes.set(uri, data.likeUri);
    } else {
      // Revert on failure
      btn.classList.remove('liked');
      btn.innerHTML = `${heartOutline}<span class="lc">${currentCount}</span>`;
    }
  }

  btn.disabled = false;
});

// ── Feed rendering ────────────────────────────────────────────────
function renderPost(post) {
  const el = document.createElement('article');
  el.className = 'post';

  const av = post.author.avatar
    ? `<img class="avatar" src="${esc(post.author.avatar)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="avatar-ph">🧑</div>`;

  const liked   = localLikes.has(post.uri);
  const likesvg = liked
    ? `<svg viewBox="0 0 24 24" fill="var(--like)" stroke="var(--like)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : heartOutline;

  const postText = post.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/#(\w+)/g, '<span class="ht">#$1</span>');

  const images = post.images || [];
  const imagesHtml = images.length ? `
    <div class="post-images count-${images.length}">
      ${images.map(img => {
        if (img.isGif && img.gif) {
          // Direct .gif URL — render inline and animated
          return `<img class="post-img" src="${esc(img.gif)}" alt="${esc(img.alt)}" style="border-radius:8px;margin-top:9px">`;
        }
        if (img.isGif && img.embedUrl) {
          return `<div class="post-gif-wrap">
            <iframe src="${esc(img.embedUrl)}" allowfullscreen title="${esc(img.alt)}"></iframe>
          </div>`;
        }
        if (img.thumb) {
          return `<a href="${esc(img.fullsize)}" target="_blank" rel="noopener">
            <img class="post-img" src="${esc(img.thumb)}" alt="${esc(img.alt)}" loading="lazy">
          </a>`;
        }
        return '';
      }).join('')}
    </div>` : '';

  el.innerHTML = `
    <div class="post-header">
      ${av}
      <div class="author-info">
        <div class="display-name">${esc(post.author.displayName)}</div>
        <div class="handle">@${esc(post.author.handle)}</div>
      </div>
      <span class="ts">${relativeTime(post.createdAt)}</span>
    </div>
    <div class="post-text">${postText}</div>
    ${imagesHtml}
    <div class="post-footer">
      <button class="action-btn like-btn ${liked?'liked':''}"
        data-uri="${esc(post.uri)}" data-cid="${esc(post.cid)}"
        ${sessionId ? '' : 'disabled title="Sign in to like"'}>
        ${likesvg}<span class="lc">${post.likeCount}</span>
      </button>
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>${post.replyCount}</span>
      </button>
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span>${post.repostCount}</span>
      </button>
      <a class="open-btn" href="${esc(post.url)}" target="_blank" rel="noopener">Open ↗</a>
    </div>`;
  return el;
}

// ── Tasting panel ─────────────────────────────────────────────────
const SCORE_SHORT = [
  "Charity raffle material 😬",
  "Gift only — wouldn't spend my own money",
  "A glass at a decent price, no bottle",
  "Damn drinkable — would happily buy one",
  "Over the moon 🌙",
  "Sweaty toes territory 🤌",
];
const SCORE_FULL = [
  "I would smile graciously if given a bottle of this then promptly deliver it to the local Primary School charity raffle.",
  "I'd drink it if given to me as a gift, but wouldn't waste my own money on a bottle.",
  "At a decent price I'd buy a glass of this, but wouldn't invest in a whole bottle.",
  "Damn drinkable and if within my price range, I'd happily buy (or have bought) one of these and enjoy it.",
  "I'd be over the moon if given a bottle of this, and would probably drink it fairly quickly.",
  "I'd suck the sweaty toes of a senior brand executive for the opportunity to have a single drop more of this.",
];

// Per-dram state (keyed 1–5)
const dramState = {};
for (let i = 1; i <= 5; i++) dramState[i] = { nose:'', palate:'', finish:'', score:null };
let activeDram = 1;

const dramTabs    = document.querySelectorAll('.dram-tab');
const tNose       = document.getElementById('t-nose');
const tPalate     = document.getElementById('t-palate');
const tFinish     = document.getElementById('t-finish');
const tStarsRow   = document.getElementById('t-stars');
const tScoreDesc  = document.getElementById('t-score-desc');
const tPostNose   = document.getElementById('t-post-nose');
const tPostPalate = document.getElementById('t-post-palate');
const tPostFinish = document.getElementById('t-post-finish');
const tPostScore  = document.getElementById('t-post-score');
const tPostAll    = document.getElementById('t-post-all');
const tDramNum    = document.getElementById('t-dram-num');
const tastingFb   = document.getElementById('tasting-feedback');
const tabTasting  = document.getElementById('tab-tasting');
const tabPost     = document.getElementById('tab-post');
const tastingPanel= document.getElementById('tasting-panel');
const freePanel   = document.getElementById('free-post-panel');

// Mode switching
tabTasting.addEventListener('click', () => {
  tabTasting.classList.add('active'); tabPost.classList.remove('active');
  tastingPanel.style.display = ''; freePanel.classList.remove('on');
});
tabPost.addEventListener('click', () => {
  tabPost.classList.add('active'); tabTasting.classList.remove('active');
  freePanel.classList.add('on'); tastingPanel.style.display = 'none';
});

// Dram tabs
function saveDram() {
  dramState[activeDram].nose   = tNose.value;
  dramState[activeDram].palate = tPalate.value;
  dramState[activeDram].finish = tFinish.value;
}
function loadDram(n) {
  saveDram();
  activeDram = n;
  const s = dramState[n];
  tNose.value   = s.nose;
  tPalate.value = s.palate;
  tFinish.value = s.finish;
  renderTStars(s.score);
  tDramNum.textContent = n;
  dramTabs.forEach(t => t.classList.toggle('active', parseInt(t.dataset.dram) === n));
}
dramTabs.forEach(t => t.addEventListener('click', () => loadDram(parseInt(t.dataset.dram))));

// Star rating
const tStarBtns = tStarsRow.querySelectorAll('.star-btn');
function renderTStars(sel) {
  tStarBtns.forEach(b => {
    const v = parseInt(b.dataset.score);
    v === 0 ? b.classList.toggle('selected', sel === 0)
            : b.classList.toggle('filled', sel !== null && v <= sel);
  });
  tScoreDesc.textContent = sel !== null ? SCORE_SHORT[sel] : 'Tap a star to score';
}
tStarBtns.forEach(b => {
  b.addEventListener('mouseenter', () => tScoreDesc.textContent = SCORE_SHORT[parseInt(b.dataset.score)]);
  b.addEventListener('mouseleave', () => {
    const cur = dramState[activeDram].score;
    tScoreDesc.textContent = cur !== null ? SCORE_SHORT[cur] : 'Tap a star to score';
  });
  b.addEventListener('click', () => {
    const v = parseInt(b.dataset.score);
    const newVal = dramState[activeDram].score === v ? null : v;
    dramState[activeDram].score = newVal;
    renderTStars(newVal);
  });
});

// Tasting feedback
function showTastingFb(msg, type) {
  tastingFb.textContent = msg;
  tastingFb.className = type;
  setTimeout(() => { tastingFb.className = ''; tastingFb.style.display = 'none'; }, 4000);
}

// Build post text for a tasting section (server appends #BlindDrams)
function tastingText(dram, { nose, palate, finish, score }) {
  const parts = [];
  if (nose)           parts.push(`On the nose: ${nose}`);
  if (palate)         parts.push(`On the palate: ${palate}`);
  if (finish)         parts.push(`The finish: ${finish}`);
  if (score != null)  parts.push(`Score: ${'⭐'.repeat(score)}${score===0?'🚫':''} ${score}/5 - ${SCORE_FULL[score]}`);
  return `Dram ${dram} - ${parts.join('. ')}`;
}

async function postTasting(payload) {
  if (!sessionId) return;
  const text = tastingText(payload.dram, payload);
  const r = await fetch('/api/post', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, text }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Post failed');
  pollFeed();
  return data;
}

function markDone(n) {
  document.querySelector(`.dram-tab[data-dram="${n}"]`)?.classList.add('done');
}

// Section post buttons
[
  [tPostNose,   () => ({ nose:   tNose.value.trim() })  , 'nose posted!'],
  [tPostPalate, () => ({ palate: tPalate.value.trim() }), 'palate posted!'],
  [tPostFinish, () => ({ finish: tFinish.value.trim() }), 'finish posted!'],
  [tPostScore,  () => ({ score:  dramState[activeDram].score }), 'score posted!'],
].forEach(([btn, getPayload, msg]) => {
  btn.addEventListener('click', async () => {
    const payload = getPayload();
    const val = Object.values(payload)[0];
    if (val === null || val === undefined || val === '') return;
    btn.disabled = true; btn.textContent = '…';
    try {
      await postTasting({ dram: activeDram, ...payload });
      showTastingFb(`✓ Dram ${activeDram} ${msg}`, 'ok');
      if (msg === 'score posted!') markDone(activeDram);
    } catch(e) { showTastingFb(e.message, 'err'); }
    finally { btn.disabled = false; btn.textContent = 'Post'; }
  });
});

// Post everything
tPostAll.addEventListener('click', async () => {
  saveDram();
  const s = dramState[activeDram];
  const nose = s.nose.trim(), palate = s.palate.trim(), finish = s.finish.trim(), score = s.score;
  if (!nose && !palate && !finish && score === null) {
    showTastingFb('Nothing filled in yet.', 'err'); return;
  }
  tPostAll.disabled = true; tPostAll.textContent = 'Posting…';
  try {
    await postTasting({ dram: activeDram, nose, palate, finish, score });
    showTastingFb(`✓ Dram ${activeDram} posted!`, 'ok');
    markDone(activeDram);
  } catch(e) { showTastingFb(e.message, 'err'); }
  finally { tPostAll.disabled = false; tPostAll.textContent = `Post Everything for Dram ${activeDram}`; }
});

loadDram(1);

async function pollFeed() {
  try {
    const r = await fetch('/api/feed');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const { posts, total } = await r.json();
    feedErrEl.style.display = 'none';

    if (total === 0) {
      feedEl.innerHTML = '';
      feedEl.appendChild(emptyEl);
      emptyEl.style.display = 'block';
      badgeEl.textContent = '0 posts';
      feedStatus.textContent = 'watching…';
      return;
    }

    feedEl.innerHTML = '';
    for (const post of posts) feedEl.appendChild(renderPost(post));
    badgeEl.textContent = `${total} post${total!==1?'s':''}`;
    lastUpdated = new Date();
    feedStatus.textContent = `updated ${relativeTime(lastUpdated)}`;
  } catch (err) {
    feedErrEl.textContent = `Feed error: ${err.message}`;
    feedErrEl.style.display = 'block';
    feedStatus.textContent = 'retrying…';
  }
}

// ── Auth ──────────────────────────────────────────────────────────
async function loadViewerLikes() {
  if (!sessionId) return;
  try {
    const r = await fetch(`/api/viewer-likes?sessionId=${encodeURIComponent(sessionId)}`);
    if (!r.ok) return;
    const { likes } = await r.json();
    for (const [uri, likeUri] of Object.entries(likes)) {
      localLikes.set(uri, likeUri);
    }
    pollFeed(); // re-render with filled hearts
  } catch (e) {}
}

function showLoggedIn(data) {
  loginSection.style.display = 'none';
  userStrip.classList.add('on');
  composeSec.classList.add('on');
  uAvatar.src = data.avatar || '';
  uAvatar.style.display = data.avatar ? 'block' : 'none';
  uName.textContent   = data.displayName;
  uHandle.textContent = `@${data.handle}`;
}

function showLoggedOut() {
  sessionId = null;
  sessionStorage.removeItem('bsk_sid');
  sessionStorage.removeItem('bsk_user');
  loginSection.style.display = 'block';
  userStrip.classList.remove('on');
  composeSec.classList.remove('on');
  inpPw.value = '';
  loginErrEl.style.display = 'none';
  pendingBlobs = [];
  renderImgPreviews();
  // Reset tasting state
  for (let i = 1; i <= 5; i++) dramState[i] = { nose:'', palate:'', finish:'', score:null };
  loadDram(1);
  dramTabs.forEach(t => t.classList.remove('done'));
}

loginBtn.addEventListener('click', async () => {
  const identifier = inpHandle.value.trim();
  const password   = inpPw.value.trim();
  if (!identifier || !password) return;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  loginErrEl.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ identifier, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error||'Login failed');
    sessionId = data.sessionId;
    sessionStorage.setItem('bsk_sid',  data.sessionId);
    sessionStorage.setItem('bsk_user', JSON.stringify(data));
    showLoggedIn(data);
    loadViewerLikes();
  } catch (err) {
    loginErrEl.textContent = err.message;
    loginErrEl.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  }
});

[inpHandle, inpPw].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key==='Enter') loginBtn.click(); })
);

signoutBtn.addEventListener('click', () => {
  if (sessionId)
    fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId})}).catch(()=>{});
  showLoggedOut();
  pollFeed();
});

// ── Init ──────────────────────────────────────────────────────────
if (sessionId && userInfo) { showLoggedIn(userInfo); loadViewerLikes(); }

pollFeed();
setInterval(pollFeed, 5_000);
</script>
</body>
</html>
